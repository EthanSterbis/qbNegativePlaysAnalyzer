name: Update Condensed PBP Data

on:
  schedule:
    - cron: "0 16 * * *"   # 9 AM PT (16:00 UTC)
  workflow_dispatch:        # Allow manual runs

jobs:
  update-condensed-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install dependencies
        run: |
          Rscript -e 'install.packages(c("dplyr","readr","nflreadr"))'

      - name: Run updater script
        run: |
          Rscript scripts/update_condensed_data.R

      - name: Commit and push updates
        run: |
          git config --global user.name "Ethan Sterbis"
          git config --global user.email "ethansterbis@users.noreply.github.com"
          git add data/condensed.csv
          git commit -m "Auto-update condensed play-by-play data" || echo "No changes to commit"
          git push
